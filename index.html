<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Genesis</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:
"Segoe UI",
"Microsoft YaHei",
sans-serif;
}


body{

min-height:100vh;

background:

radial-gradient(circle at center,
#312e81,
#020617 60%);

color:white;

overflow:hidden;

}



/* 粒子 */

body:before{

content:"";

position:fixed;

inset:0;

background-image:

radial-gradient(#fff 1px,transparent 1px);

background-size:

45px 45px;

opacity:.15;

animation:
stars 40s linear infinite;

}


@keyframes stars{

from{
transform:translateY(0);
}

to{
transform:translateY(-400px);
}

}



.container{

max-width:1100px;

margin:auto;

padding:40px 20px;

position:relative;

}



/* 标题 */

header{

text-align:center;

}



.logo{

font-size:70px;

}



h1{

font-size:50px;

letter-spacing:5px;

background:

linear-gradient(
90deg,
#22d3ee,
#c084fc
);

-webkit-background-clip:text;

color:transparent;

}



.sub{

margin-top:15px;

color:#cbd5e1;

font-size:20px;

}



/* AI核心 */


.core{

width:220px;

height:220px;

margin:50px auto;

border-radius:50%;


background:

radial-gradient(circle,
#fff,
#22d3ee 15%,
#2563eb 40%,
transparent 70%);


box-shadow:

0 0 100px #22d3ee;


animation:

pulse 3s infinite;

display:flex;

align-items:center;

justify-content:center;


font-size:30px;

}



@keyframes pulse{

50%{

transform:scale(1.1);

filter:
brightness(1.4);

}

}




/* 面板 */


.grid{

display:grid;

grid-template-columns:

repeat(auto-fit,minmax(230px,1fr));

gap:20px;

}



.card{

background:

rgba(255,255,255,.08);

border:

1px solid rgba(255,255,255,.2);

backdrop-filter:

blur(20px);

border-radius:25px;

padding:25px;

transition:.4s;

}


.card:hover{

transform:

translateY(-10px);

box-shadow:

0 20px 50px #0008;

}



.icon{

font-size:35px;

}


.title{

margin-top:15px;

font-size:22px;

}



.info{

margin-top:10px;

color:#cbd5e1;

line-height:1.8;

}



/* DNA */

.dna{

position:fixed;

right:80px;

top:120px;

font-size:80px;

opacity:.2;

animation:

rotate 10s linear infinite;

}



@keyframes rotate{

from{
transform:rotate(0);
}

to{
transform:rotate(360deg);
}

}



/* 进度 */


.progress{

height:10px;

background:#334155;

border-radius:20px;

margin-top:15px;

overflow:hidden;

}


.progress span{

display:block;

height:100%;

width:86%;

background:

linear-gradient(
90deg,
#22d3ee,
#c084fc
);

}



footer{

text-align:center;

margin-top:50px;

color:#94a3b8;

}


</style>

</head>



<body>


<div class="container">


<header>

<div class="logo">

🧬

</div>


<h1>
DIGITAL GENESIS
</h1>


<div class="sub">

数字生命起源中心

</div>


</header>




<div class="core">

AI

</div>




<section class="grid">


<div class="card">

<div class="icon">
🧠
</div>

<div class="title">
Neural Core
</div>


<div class="info">

AI Brain Status

<br>

Learning...

<br>

Knowledge:
92%

</div>


</div>



<div class="card">

<div class="icon">
🧬
</div>


<div class="title">

Evolution

</div>


<div class="info">

Generation 027

<div class="progress">

<span></span>

</div>


</div>

</div>




<div class="card">


<div class="icon">
🌐
</div>


<div class="title">

Connections

</div>


<div class="info">

Cloud Network

<br>

API Nodes

<br>

Global Agents

</div>


</div>




<div class="card">

<div class="icon">

🤖

</div>


<div class="title">

Active Agents

</div>


<div class="info">

Builder

<br>

Monitor

<br>

Researcher

</div>


</div>




</section>




<footer>

DIGITAL GENESIS PROJECT · 2026

</footer>



</div>



<div class="dna">

🧬

</div>



</body>

</html>
